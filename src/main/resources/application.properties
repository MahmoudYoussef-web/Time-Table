# ===============================
# Application
# ===============================
spring.application.name=timetable-scheduler
server.port=8080
spring.main.banner-mode=off

# ===============================
# Database (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/timetable_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=dev_user
spring.datasource.password=Dev@2026#


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false



# ===============================
# Swagger
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# JWT
# ===============================
jwt.secret=R4nd0mVeryLongSecretKeyForHS256Algorithm1234567890
jwt.expiration=900000

# ===============================
# Genetic Algorithm
# ===============================
ga.tournament-size=3

# Turn off the Spring Boot banner


# Reduce logging level. Set logging level to warn

spring.jpa.open-in-view=false

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true

logging.level.org.springframework=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.root=INFO

ga.population-size=150
ga.max-generations=500
ga.crossover-rate=0.8
ga.mutation-rate=0.1
ga.elitism-count=5
ga.early-stop-threshold=0.99
ga.max-execution-millis=30000
ga.random-seed=42