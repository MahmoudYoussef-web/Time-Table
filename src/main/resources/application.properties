##################################
# Application
##################################
spring.application.name=timetable-scheduler
server.port=8080

##################################
# Database (H2 - In Memory)
##################################
spring.datasource.url=jdbc:h2:mem:timetabledb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

##################################
# H2 Console
##################################
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

##################################
# Swagger / OpenAPI (DEFAULT PATHS - IMPORTANT)
##################################
# ? ??? ????? ????? ???????? ???? ??? ??? ???????
# springdoc.api-docs.path=/api-docs
# springdoc.swagger-ui.path=/swagger-ui.html

##################################
# Logging
##################################
logging.level.com.example.timetable=DEBUG
logging.level.org.springdoc=INFO
logging.level.io.swagger.v3=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

##################################
# Instructor Gap Preference
##################################
ga.gap.min-minutes=60

##################################
# Genetic Algorithm - Core Params
##################################
ga.population-size=50
ga.max-generations=100
ga.crossover-rate=0.8
ga.mutation-rate=0.1
ga.elitism-count=5
ga.early-stop-threshold=0.95
ga.random-seed=42

##################################
# Genetic Algorithm - Selection
##################################
ga.tournament-size=5

##################################
# Genetic Algorithm - Fitness Weights
##################################
ga.weight-hard=1000
ga.weight-soft=10

##################################
# Error Details (DEV ONLY)
##################################
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


