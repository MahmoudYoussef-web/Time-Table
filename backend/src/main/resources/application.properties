# ===============================
# Application
# ===============================
spring.application.name=timetable-scheduler
server.port=8081
spring.main.banner-mode=off

# ===============================
# Database (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/timetable_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=dev_user
spring.datasource.password=${MYSQL_PASSWORD:-Dev@2026#}
spring.jpa.properties.hibernate.auto_quote_keyword=true

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# Swagger
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# JWT
# ===============================
# DEV ONLY: Override with JWT_SECRET env var in production (min 32 chars)
jwt.secret=R4nd0mVeryLongSecretKeyForHS256Algorithm1234567890
jwt.expiration=86400000

# ===============================
# Genetic Algorithm
# ===============================
ga.tournament-size=3
ga.population-size=30
ga.max-generations=30
ga.crossover-rate=0.8
ga.mutation-rate=0.15
ga.elitism-count=3
ga.early-stop-threshold=0.90
ga.max-execution-millis=15000

ga.weight-hard=10
ga.weight-soft=1

spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN
logging.level.com.example.timetable=INFO

# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
