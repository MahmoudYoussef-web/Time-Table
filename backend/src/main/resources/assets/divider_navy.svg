<svg xmlns="http://www.w3.org/2000/svg" width="400" height="24" viewBox="0 0 400 24">
  <!-- Left line -->
  <rect x="0" y="10" width="156" height="4" fill="#00133C"/>
  <!-- Right line -->
  <rect x="220" y="10" width="180" height="4" fill="#00133C"/>
  <!-- Diamond 1 (left) — center at (180, 12), half-w=10, half-h=6 -->
  <polygon points="170,12 180,6 190,12 180,18" fill="#00133C"/>
  <!-- Diamond 2 (right) — center at (200, 12), half-w=10, half-h=6 -->
  <polygon points="190,12 200,6 210,12 200,18" fill="#00133C"/>
  <!-- Gap between line end (156) and diamond (170) = 14px -->
  <!-- Gap between diamond (210) and right line (228) = 18px -->
</svg>
