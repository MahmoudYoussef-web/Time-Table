# ===============================
# Application
# ===============================
spring.application.name=timetable-scheduler
server.port=8080
spring.main.banner-mode=off
# ===============================
# Database (TiDB Cloud)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# Swagger
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:R4nd0mVeryLongSecretKeyForHS256Algorithm1234567890}
jwt.expiration=3600000

# ===============================
# Genetic Algorithm
# ===============================
ga.tournament-size=3
ga.population-size=20
ga.max-generations=20
ga.crossover-rate=0.8
ga.mutation-rate=0.1
ga.elitism-count=2
ga.early-stop-threshold=0.90
ga.max-execution-millis=10000
ga.weight-hard=10
ga.weight-soft=1

spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN